<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="210mm" height="297mm" viewBox="0 0 210 297" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="card-shadow" x="-4%" y="-4%" width="108%" height="116%">
      <feDropShadow dx="0" dy="0.6" stdDeviation="1.2" flood-color="#1B4332" flood-opacity="0.10"/>
    </filter>
    <style>text { font-family: Arial, Helvetica, sans-serif; }</style>
  </defs>

  <!-- Background -->
  <rect fill="#EEF4EF" x="0" y="0" width="210" height="297"/>

  <!-- Header -->
  <rect fill="#1B4332" x="0" y="0" width="210" height="52"/>
  <rect fill="#40916C" x="0" y="47" width="210" height="5"/>
  <circle fill="#40916C" cx="191" cy="21" r="15" opacity="0.20"/>
  <circle fill="#52B788" cx="191" cy="21" r="9"  opacity="0.20"/>
  <text fill="#B7E4C7" font-size="3.0" font-weight="400" x="13" y="13" letter-spacing="1.8">PRŮVODCE NÁSTROJEM</text>
  <text fill="#FFFFFF"  font-size="7.0" font-weight="700" x="13" y="25">Jak vybrat správné dřeviny</text>
  <text fill="#FFFFFF"  font-size="7.0" font-weight="700" x="13" y="34">pro agrolesnictví</text>
  <text fill="#B7E4C7" font-size="3.3" x="13" y="44">Tři kroky: tvrdý filtr  →  bodové stanoviště  →  doplňkové filtry</text>

  <!-- ═══ KROK 1 ═══ -->
  <rect fill="#FFFFFF" x="12" y="57" rx="3" ry="3" width="186" height="67" filter="url(#card-shadow)"/>
  <path fill="#2D6A4F" d="M 12,60 Q 12,57 15,57 L 18,57 L 18,124 L 15,124 Q 12,124 12,121 Z"/>
  <circle fill="#2D6A4F" cx="28" cy="65" r="5.5"/>
  <text fill="#FFFFFF" font-size="5.5" font-weight="700" x="28" y="66.9" text-anchor="middle">1</text>
  <text fill="#1B4332" font-size="4.6" font-weight="700" x="37" y="67">Produkční cíle — tvrdý filtr</text>
  <text fill="#6B7280" font-size="3.1" x="37" y="74">Zaškrtněte, co od dřeviny chcete. Druhy, které podmínku nesplňují, jsou okamžitě vyřazeny.</text>
  <line x1="37" y1="78" x2="196" y2="78" stroke="#E5E7EB" stroke-width="0.5"/>

  <!-- ─── Chip 1: Produkce ovoce (s ilustrací jablka) ─── -->
  <rect fill="#F0FDF4" x="37" y="81" rx="2" ry="2" width="51" height="13" stroke="#BBF7D0" stroke-width="0.5"/>
  <g transform="translate(39,82.5) scale(0.72)" stroke="#2D6A4F" stroke-width="1.1" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- jablko: tělo -->
    <path d="M5,3.5 C2.8,3.5 1.2,4.8 1.2,6.5 C1.2,8.5 2.8,9.5 5,9.5 C7.2,9.5 8.8,8.5 8.8,6.5 C8.8,4.8 7.2,3.5 5,3.5 Z"/>
    <!-- jablko: žlábek mezi dvěma hrbolky nahoře -->
    <path d="M3.5,3.5 C4.2,2.6 4.7,3.1 5,3.5 C5.3,3.1 5.8,2.6 6.5,3.5"/>
    <!-- jablko: stopka -->
    <line x1="5" y1="3.5" x2="5" y2="2"/>
    <!-- jablko: lístek -->
    <path d="M5,2.5 C5.6,1.2 7.9,1.3 7.3,3"/>
  </g>
  <text fill="#1B4332" font-size="3.1" font-weight="600" x="48" y="89">Produkce ovoce</text>

  <!-- ─── Chip 2: Krmivo ─── -->
  <rect fill="#F0FDF4" x="91" y="81" rx="2" ry="2" width="51" height="13" stroke="#BBF7D0" stroke-width="0.5"/>
  <g transform="translate(93,82.5) scale(0.72)" stroke="#2D6A4F" stroke-width="1.1" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- list / krmivo -->
    <path d="M2,9.5 C2,5 4.5,1.8 8.8,0.8 C8.8,4.8 6.2,8.2 2,9.5 Z"/>
    <line x1="2" y1="9.5" x2="7" y2="3.5"/>
  </g>
  <text fill="#1B4332" font-size="3.1" font-weight="600" x="102" y="89">Krmivo pro zvířata</text>

  <!-- ─── Chip 3: Produkce dřeva ─── -->
  <rect fill="#F0FDF4" x="145" y="81" rx="2" ry="2" width="51" height="13" stroke="#BBF7D0" stroke-width="0.5"/>
  <g transform="translate(147,82.5) scale(0.72)" stroke="#2D6A4F" stroke-width="1.1" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- strom: dvě trojúhelníkové patra + kmen -->
    <polygon points="5,0.5 1.5,5.5 8.5,5.5"/>
    <polygon points="5,3 2.5,7.5 7.5,7.5"/>
    <line x1="5" y1="7.5" x2="5" y2="9.5"/>
  </g>
  <text fill="#1B4332" font-size="3.1" font-weight="600" x="156" y="89">Produkce dřeva</text>

  <!-- ─── Chip 4: Okrasná funkce ─── -->
  <rect fill="#F0FDF4" x="37" y="97" rx="2" ry="2" width="51" height="13" stroke="#BBF7D0" stroke-width="0.5"/>
  <g transform="translate(39,98.5) scale(0.72)" stroke="#2D6A4F" stroke-width="0.95" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- 5 okvětních lístků + střed -->
    <circle cx="5" cy="5" r="1.6"/>
    <ellipse cx="5" cy="1.8" rx="1.1" ry="1.7"/>
    <ellipse cx="5" cy="1.8" rx="1.1" ry="1.7" transform="rotate(72,5,5)"/>
    <ellipse cx="5" cy="1.8" rx="1.1" ry="1.7" transform="rotate(144,5,5)"/>
    <ellipse cx="5" cy="1.8" rx="1.1" ry="1.7" transform="rotate(216,5,5)"/>
    <ellipse cx="5" cy="1.8" rx="1.1" ry="1.7" transform="rotate(288,5,5)"/>
  </g>
  <text fill="#1B4332" font-size="3.1" font-weight="600" x="48" y="105">Okrasná funkce</text>

  <!-- ─── Chip 5: Dotace ─── -->
  <rect fill="#F0FDF4" x="91" y="97" rx="2" ry="2" width="51" height="13" stroke="#BBF7D0" stroke-width="0.5"/>
  <g transform="translate(93,98.5) scale(0.72)" stroke="#2D6A4F" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- dokument s řádky -->
    <rect x="1.5" y="0.5" width="7" height="9" rx="0.8"/>
    <line x1="3" y1="3.2" x2="7" y2="3.2"/>
    <line x1="3" y1="5.2" x2="7" y2="5.2"/>
    <line x1="3" y1="7.2" x2="5.5" y2="7.2"/>
  </g>
  <text fill="#1B4332" font-size="3.1" font-weight="600" x="102" y="105">Dotace NV 140/2023</text>

  <!-- ─── Chip 6: Výška stromu ─── -->
  <rect fill="#F0FDF4" x="145" y="97" rx="2" ry="2" width="51" height="13" stroke="#BBF7D0" stroke-width="0.5"/>
  <g transform="translate(147,98.5) scale(0.72)" stroke="#2D6A4F" stroke-width="1.1" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- šipka nahoru s podlahou -->
    <line x1="5" y1="9.5" x2="5" y2="0.5"/>
    <polyline points="2.8,3 5,0.5 7.2,3"/>
    <line x1="2" y1="9.5" x2="8" y2="9.5"/>
  </g>
  <text fill="#1B4332" font-size="3.1" font-weight="600" x="156" y="105">Max. výška stromu</text>

  <!-- Summary 1 -->
  <rect fill="#F0FDF4" x="37" y="113" rx="2" ry="2" width="157" height="8"/>
  <text fill="#166534" font-size="3.0" font-style="italic" x="41" y="118.5">Výsledek: zobrazí se pouze dřeviny splňující všechna zaškrtnutá kritéria.</text>

  <!-- Arrow 1 → 2 -->
  <line x1="105" y1="127" x2="105" y2="134" stroke="#9CA3AF" stroke-width="0.8"/>
  <polygon fill="#9CA3AF" points="105,136 102.5,132 107.5,132"/>

  <!-- ═══ KROK 2 ═══ -->
  <rect fill="#FFFFFF" x="12" y="138" rx="3" ry="3" width="186" height="72" filter="url(#card-shadow)"/>
  <path fill="#1E6091" d="M 12,141 Q 12,138 15,138 L 18,138 L 18,210 L 15,210 Q 12,210 12,207 Z"/>
  <circle fill="#1E6091" cx="28" cy="146" r="5.5"/>
  <text fill="#FFFFFF" font-size="5.5" font-weight="700" x="28" y="147.9" text-anchor="middle">2</text>
  <text fill="#1B3A5C" font-size="4.6" font-weight="700" x="37" y="148">Podmínky stanoviště — bodové pořadí</text>
  <text fill="#6B7280" font-size="3.1" x="37" y="155">Každá dřevina dostane skóre 0–3 za každou podmínku. Součet určuje pořadí v doporučení.</text>
  <line x1="37" y1="159" x2="196" y2="159" stroke="#E5E7EB" stroke-width="0.5"/>

  <!-- ─── Chip 1: Klimatický region ─── -->
  <rect fill="#EFF6FF" x="37" y="162" rx="2" ry="2" width="76" height="13" stroke="#BFDBFE" stroke-width="0.5"/>
  <g transform="translate(39,163.5) scale(0.72)" stroke="#1E6091" stroke-width="1.1" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5,9.8 C5,9.8 1,5.5 1,3.5 C1,1.5 2.8,0.3 5,0.3 C7.2,0.3 9,1.5 9,3.5 C9,5.5 5,9.8 5,9.8 Z"/>
    <circle cx="5" cy="3.5" r="1.4"/>
  </g>
  <text fill="#1B3A5C" font-size="3.1" font-weight="600" x="48" y="170">Klimatický region</text>

  <!-- ─── Chip 2: Nadmořská výška ─── -->
  <rect fill="#EFF6FF" x="116" y="162" rx="2" ry="2" width="76" height="13" stroke="#BFDBFE" stroke-width="0.5"/>
  <g transform="translate(118,163.5) scale(0.72)" stroke="#1E6091" stroke-width="1.1" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="0.5,9.5 4.5,2.5 6.5,6 8,4 9.8,9.5"/>
    <line x1="0.5" y1="9.5" x2="9.8" y2="9.5"/>
  </g>
  <text fill="#1B3A5C" font-size="3.1" font-weight="600" x="127" y="170">Nadmořská výška</text>

  <!-- ─── Chip 3: Vodní režim půdy ─── -->
  <rect fill="#EFF6FF" x="37" y="178" rx="2" ry="2" width="76" height="13" stroke="#BFDBFE" stroke-width="0.5"/>
  <g transform="translate(39,179.5) scale(0.72)" stroke="#1E6091" stroke-width="1.1" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5,0.5 C5,0.5 1,5.2 1,7 C1,8.7 2.8,9.7 5,9.7 C7.2,9.7 9,8.7 9,7 C9,5.2 5,0.5 5,0.5 Z"/>
  </g>
  <text fill="#1B3A5C" font-size="3.1" font-weight="600" x="48" y="186">Vodní režim půdy</text>

  <!-- ─── Chip 4: Úrodnost půdy ─── -->
  <rect fill="#EFF6FF" x="116" y="178" rx="2" ry="2" width="76" height="13" stroke="#BFDBFE" stroke-width="0.5"/>
  <g transform="translate(118,179.5) scale(0.72)" stroke="#1E6091" stroke-width="1.1" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="1" y1="4" x2="9" y2="4"/>
    <line x1="1" y1="7" x2="9" y2="7"/>
    <line x1="1" y1="9.5" x2="9" y2="9.5"/>
    <line x1="5" y1="4" x2="5" y2="1.8"/>
    <path d="M5,2.6 C5.5,1.5 7.5,1.5 7,2.9"/>
    <path d="M5,2.3 C4.5,1.2 2.5,1.5 3,2.9"/>
  </g>
  <text fill="#1B3A5C" font-size="3.1" font-weight="600" x="127" y="186">Úrodnost půdy</text>

  <!-- Summary 2 -->
  <rect fill="#EFF6FF" x="37" y="196" rx="2" ry="2" width="157" height="8"/>
  <text fill="#1E40AF" font-size="3.0" font-style="italic" x="41" y="201.5">Výsledek: nejlépe přizpůsobené druhy se zobrazí vlevo v motýlovém grafu.</text>

  <!-- Arrow 2 → 3 -->
  <line x1="105" y1="213" x2="105" y2="220" stroke="#9CA3AF" stroke-width="0.8"/>
  <polygon fill="#9CA3AF" points="105,222 102.5,218 107.5,218"/>

  <!-- ═══ KROK 3 ═══ -->
  <rect fill="#FFFFFF" x="12" y="224" rx="3" ry="3" width="186" height="58" filter="url(#card-shadow)"/>
  <path fill="#92400E" d="M 12,227 Q 12,224 15,224 L 18,224 L 18,282 L 15,282 Q 12,282 12,279 Z"/>
  <circle fill="#92400E" cx="28" cy="232" r="5.5"/>
  <text fill="#FFFFFF" font-size="5.5" font-weight="700" x="28" y="233.9" text-anchor="middle">3</text>
  <text fill="#451A03" font-size="4.6" font-weight="700" x="37" y="234">Vlastnosti dřeviny — doplňkové filtry</text>
  <text fill="#6B7280" font-size="3.1" x="37" y="241">Tyto filtry neovlivňují pořadí — pouze dále omezují zobrazené druhy dle vaší preference.</text>
  <line x1="37" y1="245" x2="196" y2="245" stroke="#E5E7EB" stroke-width="0.5"/>

  <!-- ─── Chip 1: Nároky na světlo ─── -->
  <rect fill="#FFF7ED" x="37" y="248" rx="2" ry="2" width="51" height="13" stroke="#FED7AA" stroke-width="0.5"/>
  <g transform="translate(39,249.5) scale(0.72)" stroke="#92400E" stroke-width="1.1" fill="none" stroke-linecap="round">
    <circle cx="5" cy="5" r="2.5"/>
    <line x1="5" y1="0.5" x2="5" y2="1.8"/>
    <line x1="5" y1="8.2" x2="5" y2="9.5"/>
    <line x1="0.5" y1="5" x2="1.8" y2="5"/>
    <line x1="8.2" y1="5" x2="9.5" y2="5"/>
    <line x1="1.9" y1="1.9" x2="2.8" y2="2.8"/>
    <line x1="8.1" y1="1.9" x2="7.2" y2="2.8"/>
    <line x1="1.9" y1="8.1" x2="2.8" y2="7.2"/>
    <line x1="8.1" y1="8.1" x2="7.2" y2="7.2"/>
  </g>
  <text fill="#451A03" font-size="3.1" font-weight="600" x="48" y="256">Nároky na světlo</text>

  <!-- ─── Chip 2: Rašení a kvetení ─── -->
  <rect fill="#FFF7ED" x="91" y="248" rx="2" ry="2" width="51" height="13" stroke="#FED7AA" stroke-width="0.5"/>
  <g transform="translate(93,249.5) scale(0.72)" stroke="#92400E" stroke-width="1.1" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="5" y1="9.5" x2="5" y2="4.2"/>
    <path d="M5,4.8 C5,4.8 2,3.8 1.5,1.2 C3.8,1 5.2,3.2 5,4.8 Z"/>
    <path d="M5,5.8 C5,5.8 8,4.8 8.5,2.2 C6.2,2 4.8,4.2 5,5.8 Z"/>
  </g>
  <text fill="#451A03" font-size="3.1" font-weight="600" x="102" y="256">Rašení a kvetení</text>

  <!-- ─── Chip 3: Vzrůst a habitus ─── -->
  <rect fill="#FFF7ED" x="145" y="248" rx="2" ry="2" width="51" height="13" stroke="#FED7AA" stroke-width="0.5"/>
  <g transform="translate(147,249.5) scale(0.72)" stroke="#92400E" stroke-width="1.1" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="5" cy="4" r="3.2"/>
    <line x1="5" y1="7.2" x2="5" y2="9.5"/>
  </g>
  <text fill="#451A03" font-size="3.1" font-weight="600" x="156" y="256">Vzrůst a habitus</text>

  <!-- Summary 3 -->
  <rect fill="#FFF7ED" x="37" y="265" rx="2" ry="2" width="157" height="7"/>
  <text fill="#92400E" font-size="2.9" font-style="italic" x="41" y="270">U každého druhu: využití dřeva, plodů, popis v ALS a leg. status (z. č. 114/1992 Sb.).</text>

  <!-- Footer -->
  <line x1="12" y1="287" x2="198" y2="287" stroke="#CBD5E1" stroke-width="0.4"/>
  <text fill="#9CA3AF" font-size="2.9" x="12" y="293">AgroforesTreeAdvice — VÚKOZ, v.v.i.</text>
  <text fill="#9CA3AF" font-size="2.9" x="198" y="293" text-anchor="end">únor 2026</text>
</svg>
